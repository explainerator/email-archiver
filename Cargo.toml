[package]
name = "email-archiver"
version = "0.1.0"
edition = "2021"
description = "Read-only email archive: S3 blob storage, Postgres index, IMAPS for clients"
license = "MIT"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
aws-config = "1.11.0"
aws-sdk-s3 = "1.144.0"
blake3 = "1.8.7"
serde_json = "1.0.151"
chrono = "0.4.45"
mail-parser = "0.11.8"
futures = "0.3.34"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"
imap-next = "0.3.4"
base64 = "0.23.1"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
