[package]
name = "email-archiver"
version = "0.1.0"
edition = "2021"
description = "Read-only email archive: S3 blob storage, Postgres index, IMAPS for clients"
license = "MIT"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
aws-config = "1.11.0"
aws-sdk-s3 = "1.144.0"
blake3 = "1.8.7"
serde_json = "1.0.151"
chrono = "0.4.45"
